name: Eclipse Version Compatibility

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 2024-06
            resolve_with_ee_constraints: 'true'
          - target: 2024-09
            resolve_with_ee_constraints: 'true'
          - target: 2024-12
            resolve_with_ee_constraints: 'true'
          - target: 2025-03
            resolve_with_ee_constraints: 'false'
          - target: 2025-06
            resolve_with_ee_constraints: 'false'
          - target: 2025-09
            resolve_with_ee_constraints: 'false'
          - target: 2025-12
            resolve_with_ee_constraints: 'false'
          - target: 2026-03
            resolve_with_ee_constraints: 'false'
    runs-on: windows-latest
    name: Eclipse ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'
      - name: Build with Maven against Eclipse ${{ matrix.target }}
        # Plugin is currently JavaSE-17, so 2025-03+ targets (with JavaSE-21 IUs) disable EE constraints here.
        # If the plugin baseline is upgraded to JavaSE-21, this split can be removed and EE constraints can stay enabled.
        run: mvn -B clean verify -ntp "-Dtarget.platform.file=targets/${{ matrix.target }}.target" "-Dtarget.resolve.with.ee.constraints=${{ matrix.resolve_with_ee_constraints }}"
